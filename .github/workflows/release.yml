name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Look up merged PR for HEAD commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Default GITHUB_TOKEN can read PRs in this repo (pull-requests: read).
          # The /commits/{sha}/pulls endpoint returns all PRs associated with the
          # commit, regardless of merge style (merge/squash/rebase). We pick the
          # first merged one. Direct pushes to main return an empty array.
          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                       --jq '[.[] | select(.merged_at != null)] | first')
          if [ "$PR_JSON" = "null" ] || [ -z "$PR_JSON" ]; then
            echo "No merged PR associated with $GITHUB_SHA. Skipping release."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TITLE=$(echo "$PR_JSON" | jq -r .title)
          BODY=$(echo "$PR_JSON" | jq -r '.body // ""')
          echo "found=true" >> "$GITHUB_OUTPUT"
          {
            echo "title<<__PR_TITLE_EOF__"
            printf '%s\n' "$TITLE"
            echo "__PR_TITLE_EOF__"
            echo "body<<__PR_BODY_EOF__"
            printf '%s\n' "$BODY"
            echo "__PR_BODY_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Found PR: $TITLE"

      - name: Determine bump from PR title
        id: bump
        if: steps.pr.outputs.found == 'true'
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
        run: |
          BUMP=$(.github/scripts/compute-bump.sh "$PR_TITLE" <<< "$PR_BODY")
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          if [ -z "$BUMP" ]; then
            echo "PR title '$PR_TITLE' does not indicate a release. Exiting cleanly."
          else
            echo "Bump: $BUMP"
          fi

      - name: Bump package.json version
        if: steps.bump.outputs.bump != ''
        id: version
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          pnpm version "$BUMP" --no-git-tag-version
          NEW=$(jq -r .version package.json)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW"

      - name: Install dependencies
        if: steps.bump.outputs.bump != ''
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: steps.bump.outputs.bump != ''
        run: pnpm test

      - name: Build plugin
        if: steps.bump.outputs.bump != ''
        run: pnpm build

      - name: Publish to npm (OIDC)
        if: steps.bump.outputs.bump != ''
        run: pnpm publish --access public --provenance --no-git-checks

      - name: Commit bump, tag, and push
        if: steps.bump.outputs.bump != ''
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          # Push uses the default GITHUB_TOKEN, which does NOT trigger another
          # workflow run (per GitHub policy), so this is loop-safe.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.bump.outputs.bump != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          gh release create "v${NEW_VERSION}" \
            --generate-notes \
            --title "v${NEW_VERSION}"
